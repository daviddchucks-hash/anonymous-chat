<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat: Passerby</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="chat-body">
  <div id="banner" class="banner" role="status" hidden></div>

  <!-- Connecting -->
  <section id="screen-connecting" class="screen center-screen" aria-live="polite">
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1 tabindex="-1">Connecting…</h1>
  </section>

  <!-- 3. Matching -->
  <section id="screen-matching" class="screen center-screen" hidden>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1 id="matching-title" tabindex="-1">Finding someone…</h1>
    <p id="matching-sub"></p>
    <div id="no-match" class="callout" hidden role="status">
      <strong id="no-match-title">Nobody here for that topic yet</strong>
      <p id="no-match-text"></p>
      <div class="btn-row">
        <button id="match-anyone" class="btn btn-primary" type="button">Match with anyone</button>
        <button id="keep-waiting" class="btn btn-secondary" type="button">Keep waiting</button>
      </div>
    </div>
    <button id="cancel-btn" class="btn btn-secondary" type="button">Cancel</button>
  </section>

  <!-- 4. Chat (also hosts the "ended" state so the last messages can still be read) -->
  <section id="screen-chat" class="screen" hidden>
    <header class="chat-header">
      <div class="who">
        <span id="stranger-name" class="tag">Stranger</span>
        <span class="status"><span id="status-dot" class="dot" data-state="ok"></span><span id="status-text">Connected</span></span>
      </div>
      <div class="actions">
        <button id="report-btn" class="btn btn-sm btn-secondary" type="button">Report</button>
        <button id="block-btn" class="btn btn-sm btn-secondary" type="button">Block</button>
        <button id="end-btn" class="btn btn-sm btn-danger" type="button">End chat</button>
      </div>
    </header>

    <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation" tabindex="0"></div>
    <div id="typing" class="typing" aria-live="polite"></div>

    <form id="composer" class="composer" autocomplete="off">
      <div class="composer-field">
        <textarea id="input" rows="1" aria-label="Message" placeholder="Type a message" enterkeyhint="send" maxlength="500"></textarea>
        <span id="counter" class="counter" hidden></span>
      </div>
      <button id="send-btn" class="btn btn-primary" type="submit">Send</button>
    </form>

    <!-- 5. Ended -->
    <div id="ended-panel" class="ended-panel" hidden>
      <h2 id="ended-title" tabindex="-1">Conversation ended</h2>
      <p id="ended-text"></p>
      <div class="btn-row">
        <button id="find-another" class="btn btn-primary" type="button">Find Another Stranger</button>
        <a id="return-home" class="btn btn-secondary" href="/">Return home</a>
      </div>
    </div>
  </section>

  <!-- Errors that cannot be retried (banned, too many tabs, ...) -->
  <section id="screen-error" class="screen center-screen" hidden>
    <h1 id="error-title" tabindex="-1">Something went wrong</h1>
    <p id="error-text"></p>
    <a class="btn btn-primary" href="/">Return home</a>
  </section>

  <!-- Dialogs -->
  <dialog id="report-dialog" class="modal" aria-labelledby="report-title">
    <form id="report-form">
      <h2 id="report-title">Report this stranger</h2>
      <p>A report contains only the reason and the minimum details needed for moderation, not your identity.</p>
      <div class="reasons" role="radiogroup" aria-label="Reason">
        <label><input type="radio" name="reason" value="spam" checked> Spam or advertising</label>
        <label><input type="radio" name="reason" value="harassment"> Harassment or bullying</label>
        <label><input type="radio" name="reason" value="sexual_content"> Sexual content</label>
        <label><input type="radio" name="reason" value="hate_speech"> Hate speech</label>
        <label><input type="radio" name="reason" value="underage"> Seems to be under 18</label>
        <label><input type="radio" name="reason" value="other"> Something else</label>
      </div>
      <label class="field-label" for="report-note">Details (optional)</label>
      <textarea id="report-note" maxlength="200"></textarea>
      <p id="report-error" class="form-error" role="alert"></p>
      <div class="btn-row">
        <button id="report-cancel" class="btn btn-secondary" type="button">Cancel</button>
        <button id="report-submit" class="btn btn-solid-danger" type="submit">Send report</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="modal" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Are you sure?</h2>
    <p id="confirm-text"></p>
    <div class="btn-row">
      <button id="confirm-cancel" class="btn btn-secondary" type="button">Cancel</button>
      <button id="confirm-ok" class="btn btn-solid-danger" type="button">Confirm</button>
    </div>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
